<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ISLAND</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' fill='none' stroke='%23ff8a2a' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%235fd8ff'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- Title screen -->
  <div id="title-screen">
    <div class="title-frame"></div>
    <p class="title-over">EXPEDITION // UNCHARTED SEA</p>
    <h1 class="title-word">ISLAND</h1>
    <p class="title-sub">The island of Cadence is still listening.</p>
    <button id="begin-btn">BEGIN</button>
    <p class="title-mode" id="title-mode"></p>
  </div>

  <!-- Game -->
  <div id="game" hidden>
    <div id="stage">
      <img id="scene-img" alt="" draggable="false" />
      <img id="scene-img-old" alt="" draggable="false" />
      <div id="hotspots"></div>
      <div id="nav-dots"></div>
      <div id="vignette"></div>
      <div id="ripple"></div>
      <div id="cursor-ring"></div>
      <div id="cursor-label"></div>

      <!-- transition veil -->
      <div id="veil">
        <div class="veil-reticle"><i></i><i></i><b></b></div>
        <div id="veil-word"></div>
        <div id="veil-lines"></div>
      </div>

      <!-- HUD -->
      <header id="hud">
        <div id="hud-left">
          <div id="scene-plate">
            <span class="plate-tag">LOC</span>
            <h2 id="scene-name"></h2>
          </div>
          <div id="depth-meter">
            <span class="meter-label">DEPTH</span>
            <div id="depth-pips"></div>
          </div>
        </div>
        <div id="hud-right">
          <button id="scan-btn" title="Reveal the routes out">◎ SCAN</button>
          <button id="ascend-btn" title="Return to the wider view">▲ ASCEND</button>
        </div>
      </header>

      <p id="toast" hidden></p>

      <!-- scan route pins -->
      <div id="scan-pins"></div>

      <!-- Satchel button -->
      <button id="inventory-btn" title="Small things worth keeping">
        <span class="plate-tag gold">BAG</span>
        <span class="inv-btn-label">SATCHEL</span>
        <span id="inv-count">0</span>
      </button>

      <!-- Satchel panel -->
      <div id="satchel" class="panel panel-satchel" hidden>
        <div class="panel-head">
          <span class="plate-tag gold">BAG</span>
          <span>Satchel</span>
          <button id="satchel-close" title="Close">✕</button>
        </div>
        <div id="satchel-list"></div>
      </div>

      <!-- Journal -->
      <button id="journal-btn" title="Fragments of the Answering">
        <span class="plate-tag cyan">LOG</span>
        <span class="journal-btn-label">JOURNAL</span>
        <span id="journal-count">0/0</span>
      </button>

      <div id="journal" class="panel panel-journal" hidden>
        <div id="journal-head" class="panel-head">
          <span class="plate-tag cyan">LOG</span>
          <span>Fragments of the Answering</span>
          <button id="journal-close" title="Close">✕</button>
        </div>
        <div id="journal-list"></div>
      </div>

      <!-- Object pickup card -->
      <div id="object-card" class="panel panel-obj" hidden>
        <div class="panel-head">
          <span class="plate-tag gold">OBJ</span>
          <h3 id="obj-name"></h3>
        </div>
        <p id="obj-desc"></p>
        <div class="card-actions">
          <button id="obj-take">TAKE</button>
          <button id="obj-leave">LEAVE</button>
        </div>
      </div>

      <!-- Character chat -->
      <div id="chat" class="panel panel-chat" hidden>
        <div id="chat-head">
          <span class="plate-tag cyan">COMMS</span>
          <span id="chat-name"></span>
          <button id="chat-close" title="Walk away">WALK AWAY</button>
        </div>
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" autocomplete="off" maxlength="240" placeholder="Say something…" />
          <button type="submit">›</button>
        </form>
      </div>

      <!-- Oracle (debug) -->
      <div id="oracle" class="panel panel-oracle" hidden>
        <div id="oracle-head">
          <span class="plate-tag violet">DBG</span>
          <span id="oracle-title">ORACLE // DEBUG</span>
          <button id="oracle-close" title="Close">✕</button>
        </div>
        <div id="oracle-log"></div>
        <form id="oracle-form">
          <input id="oracle-input" autocomplete="off" maxlength="240" placeholder="Ask the oracle…" />
          <button type="submit">›</button>
        </form>
      </div>

      <!-- Admin cluster (debug) -->
      <div id="admin-bar">
        <button id="admin-save" title="Save progress locally">SAVE</button>
        <button id="admin-oracle" title="Ask the debug oracle">ORACLE</button>
        <button id="admin-reset" title="Erase all progress">RESET</button>
      </div>

      <!-- Ending overlay -->
      <div id="ending" hidden>
        <p class="ending-over">THE ANSWERING // COMPLETE</p>
        <h2 id="ending-title"></h2>
        <p id="ending-text"></p>
        <button id="ending-close">KEEP EXPLORING</button>
      </div>
    </div>
  </div>

  <script src="/js/audio.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
